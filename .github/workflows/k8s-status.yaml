name: K8s Status (debug)

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: cluster

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Cluster status
        run: |
          set +e
          aws sts get-caller-identity --query Arn --output text
          aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION
          echo "=== NODES ==="
          kubectl get nodes -o wide
          echo "=== PODS ==="
          kubectl get pods -A -o wide
          echo "=== SERVICES ==="
          kubectl get svc -o wide
          echo "=== DEPLOYMENTS ==="
          kubectl get deploy -o wide
          echo "=== POD DETAILS (last lines) ==="
          kubectl describe pods | tail -n 60
          echo "=== NODE GROUP ==="
          aws eks describe-nodegroup --cluster-name $EKS_CLUSTER --nodegroup-name udacity \
            --query 'nodegroup.{status:status,health:health.issues}' --output json
          exit 0
